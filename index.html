<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ミセタテ ライセンス審査チェックシート｜入力イメージ</title>
<style>
:root{--ink:#202938;--muted:#64748b;--line:#e3e8ef;--bg:#f4f6fa;--blue:#234e70;--blue2:#eaf2f8;--green:#16794b;--greenbg:#e8f6ee;--amber:#9a6500;--amberbg:#fff5d9;--red:#b42318;--redbg:#fff0ee;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);line-height:1.6}
.top{background:linear-gradient(120deg,#173b58,#2b6587);color:#fff;padding:28px 20px 32px}.top-inner{max-width:960px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.8;font-weight:700}.top h1{font-size:clamp(23px,4vw,31px);margin:6px 0 4px;letter-spacing:.01em}.top p{margin:0;color:#e0edf5;font-size:14px}.wrap{max-width:960px;padding:22px 16px 48px;margin:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #192c3d08}.panel-title{font-size:16px;font-weight:800;margin:0 0 16px;display:flex;align-items:center;gap:9px}.panel-title:before{content:"";width:4px;height:20px;background:#2b6587;border-radius:3px}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:13px;color:#536273;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #ccd5df;border-radius:8px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}.field input:focus,.field select:focus{outline:3px solid #d8eaf7;border-color:#2b6587}.progressrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.progressrow strong{font-size:15px}.count{font-size:13px;color:var(--muted);font-weight:700}.bar{height:7px;border-radius:99px;background:#e9eef3;overflow:hidden;margin-bottom:22px}.bar-in{height:100%;width:0;background:#2b6587;transition:width .2s}.section{border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;background:#fff}.section-head{padding:13px 16px;background:#f1f6fa;border-bottom:1px solid var(--line);font-weight:800;color:#27465d}.item{padding:16px;border-bottom:1px solid #edf0f4}.item:last-child{border-bottom:0}.itemtop{display:flex;gap:12px;align-items:flex-start}.num{flex:0 0 40px;height:30px;background:var(--blue2);color:var(--blue);border-radius:7px;font-size:12px;font-weight:800;display:grid;place-items:center}.itembody{min-width:0;flex:1}.itemtitle{font-weight:800;font-size:14px;margin:2px 0 4px}.itemdesc{font-size:13px;color:#637184}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 0 52px}.choice{position:relative;display:inline-flex;align-items:center;cursor:pointer}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:inline-flex;align-items:center;justify-content:center;border:1px solid #d5dde6;border-radius:8px;min-width:82px;padding:7px 13px;background:#fff;font-size:13px;font-weight:700;color:#4b5969;transition:.15s}.choice input:checked+span{border-color:#2b6587;background:#eaf2f8;color:#234e70;box-shadow:inset 0 0 0 1px #2b6587}.choice.pass input:checked+span{border-color:#36a16d;background:var(--greenbg);color:var(--green)}.choice.check input:checked+span{border-color:#d49a2c;background:var(--amberbg);color:var(--amber)}.choice.fail input:checked+span{border-color:#df655c;background:var(--redbg);color:var(--red)}.note{display:block;margin:10px 0 0 52px;width:calc(100% - 52px);border:1px solid #d9e0e7;border-radius:7px;padding:9px 11px;font:inherit;font-size:13px;resize:vertical;min-height:38px}.note::placeholder{color:#97a2af}.decision{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.verdict{position:relative;cursor:pointer}.verdict input{position:absolute;opacity:0}.verdict span{display:block;text-align:center;border:1px solid #d5dde6;border-radius:9px;padding:13px 8px;font-size:14px;font-weight:800;background:#fff}.verdict input:checked+span{border-color:#2b6587;background:#eaf2f8;color:#234e70;box-shadow:inset 0 0 0 1px #2b6587}.help{font-size:12px;color:#64748b;margin:14px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:9px;padding:12px 18px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.btn-primary{color:#fff;background:#234e70}.btn-secondary{color:#31465a;background:#eaf0f5}.btn:hover{filter:brightness(.97)}.toast{margin-top:12px;color:var(--green);font-size:13px;font-weight:700;display:none}.footer{font-size:12px;color:#7b8794;text-align:center;padding:6px 10px 0}.smallcap{font-size:12px;color:#66788a;margin-top:12px}
@media(max-width:620px){.meta{grid-template-columns:1fr}.panel{padding:15px}.choices{margin-left:0}.note{margin-left:0;width:100%}.decision{grid-template-columns:1fr}.choice span{min-width:75px}.itemtop{gap:9px}.num{flex-basis:36px}.top{padding:23px 17px 27px}}
@media print{body{background:#fff}.top{padding:15px;background:#234e70!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{padding:10px;max-width:none}.panel{box-shadow:none;break-inside:avoid}.actions{display:none}.item{break-inside:avoid}}
</style></head>
<body>
<header class="top"><div class="top-inner"><div class="eyebrow">MISETATE / CONTRACTOR LICENSE</div><h1>ミセタテ ライセンス審査チェックシート</h1><p>審査担当者用・入力イメージ</p></div></header>
<main class="wrap">
<section class="panel"><h2 class="panel-title">申請情報</h2><div class="meta">
<div class="field"><label for="company">申請会社名</label><input id="company" placeholder="例：株式会社〇〇内装"></div>
<div class="field"><label for="trade">申請業種</label><select id="trade"><option value="">業種を選択してください</option><option>大工工事</option><option>内装仕上工事</option><option>LGS・PB工事</option><option>電気工事</option><option>給排水設備工事</option><option>空調・換気工事</option><option>左官工事</option><option>解体工事</option><option>塗装工事</option><option>防水工事</option><option>厨房工事</option><option>家具工事</option><option>サイン工事</option><option>その他</option></select></div>
<div class="field"><label for="reviewer">審査担当者</label><input id="reviewer" placeholder="担当者名を入力"></div>
<div class="field"><label for="date">審査日</label><input type="date" id="date"></div>
</div></section>
<section class="panel"><div class="progressrow"><h2 class="panel-title" style="margin:0">審査項目</h2><span class="count" id="count">0/27 項目入力済み</span></div><div class="bar"><div class="bar-in" id="progress"></div></div><div id="checklist"></div></section>
<section class="panel"><h2 class="panel-title">最終判定</h2><div class="decision">
<label class="verdict"><input type="radio" name="verdict" value="発行可"><span>発行可</span></label>
<label class="verdict"><input type="radio" name="verdict" value="追加確認"><span>追加確認</span></label>
<label class="verdict"><input type="radio" name="verdict" value="発行不可"><span>発行不可</span></label>
</div><div class="field" style="margin-top:14px"><label for="finalnote">総合所見・追加確認事項</label><input id="finalnote" placeholder="判定理由や追加で確認することを記入"></div>
<div class="actions"><button class="btn btn-primary" id="copy">審査結果をコピー</button><button class="btn btn-secondary" id="reset">入力をリセット</button><button class="btn btn-secondary" id="print">印刷／PDF保存</button></div><div class="toast" id="toast">審査結果をコピーしました。</div><p class="help">※ この画面は入力形式のたたき台です。コピーした結果は社内記録に保存してください。正式運用前に、業種別の許可・資格要件と社内の発行条件を確定してください。</p></section>
<div class="footer">Misetate License Review · Prototype / 社内検討用</div>
</main>
<script>
const groups=[
{title:'① 会社情報の確認',items:[['1-1','事業者の実在性','登記情報や事業実態を確認できる資料がある'],['1-2','会社名・屋号','申請内容と提出書類の名称が一致している'],['1-3','所在地','事業所の所在地を確認できる'],['1-4','代表者・事業主','代表者または事業主を確認できる'],['1-5','担当者・連絡先','担当者が明確で、電話・メール等で連絡が取れる'],['1-6','申請権限','申請者が代表者本人または権限を与えられた担当者である']]},
{title:'② 許可・資格の確認',items:[['2-1','申請業種','申請するライセンス業種が明確である'],['2-2','建設業許可','社内基準および工事内容に応じて必要な許可を確認できる'],['2-3','許可の名義・有効性','申請事業者との一致、対象業種、有効性を確認できる'],['2-4','必要資格','申請業種に必要な資格を確認できる'],['2-5','登録・届出','必要な登録・届出が確認できる']]},
{title:'③ 保険加入の確認',items:[['3-1','社会保険','加入対象の場合は加入状況を確認でき、対象外の場合は理由を記録している'],['3-2','労災保険','雇用状況等に応じた加入状況を確認できる'],['3-3','一人親方等の特別加入','該当する場合は加入状況を確認できる'],['3-4','証明資料の整合性','事業者名や加入状況が申請内容と整合している']]},
{title:'④ ルール・法令の遵守',items:[['4-1','申請内容の正確性','申請内容と提出書類に未解決の重大な矛盾がない'],['4-2','規約への同意','ミセタテの利用規約・施工会社規約への同意を確認できる'],['4-3','法令遵守の申告','法令遵守に関する申告・誓約を取得している'],['4-4','重大な違反等','定めた確認方法で確認し、該当時は責任者判断を記録している'],['4-5','変更届出ルール','会社情報や許可等の変更届出ルールに同意している']]},
{title:'⑤ ミセタテの運用対応',items:[['5-1','連絡体制','案件の連絡担当者と連絡先が明確である'],['5-2','見積書の提出','指定形式・期限に従うルールを理解している'],['5-3','工事範囲の確認','着工前に施工範囲や条件を確認する手順を理解している'],['5-4','施工資料の提出','指定写真・資料等の提出ルールを理解している'],['5-5','進捗・完了報告','進捗・完了を所定の方法で報告するルールを理解している'],['5-6','変更・追加工事','事前確認・承認手順を理解している'],['5-7','トラブル時の連絡','遅延・不具合・事故等の報告手順を理解している']]}
];
const options=[['合格','pass'],['要確認','check'],['不合格','fail'],['対象外','']];
const host=document.getElementById('checklist');let total=0;
groups.forEach((g,gi)=>{const sec=document.createElement('div');sec.className='section';const head=document.createElement('div');head.className='section-head';head.textContent=g.title;sec.appendChild(head);g.items.forEach(([id,title,desc])=>{total++;const item=document.createElement('div');item.className='item';item.dataset.id=id;const top=document.createElement('div');top.className='itemtop';top.innerHTML=`<div class="num">${id}</div><div class="itembody"><div class="itemtitle">${title}</div><div class="itemdesc">${desc}</div></div>`;item.appendChild(top);const choices=document.createElement('div');choices.className='choices';options.forEach(([opt,cls])=>{const lab=document.createElement('label');lab.className='choice '+cls;lab.innerHTML=`<input type="radio" name="${id}" value="${opt}"><span>${opt}</span>`;choices.appendChild(lab)});item.appendChild(choices);const note=document.createElement('input');note.className='note';note.placeholder='確認内容・証憑・補足メモ（任意）';note.setAttribute('aria-label',id+' 補足メモ');item.appendChild(note);sec.appendChild(item)});host.appendChild(sec)});
function update(){const done=[...host.querySelectorAll('.item')].filter(x=>x.querySelector('input[type=radio]:checked')).length;document.getElementById('count').textContent=`${done}/${total} 項目入力済み`;document.getElementById('progress').style.width=(done/total*100)+'%'}host.addEventListener('change',update);document.getElementById('date').value=new Date().toISOString().slice(0,10);
function report(){const lines=['ミセタテ ライセンス審査チェックシート','申請会社名：'+(document.getElementById('company').value||'未入力'),'申請業種：'+(document.getElementById('trade').value||'未入力'),'審査担当者：'+(document.getElementById('reviewer').value||'未入力'),'審査日：'+(document.getElementById('date').value||'未入力'),''];groups.forEach(g=>{lines.push(g.title);g.items.forEach(([id,title,desc])=>{const el=host.querySelector(`.item[data-id="${id}"]`);const value=el.querySelector('input[type=radio]:checked')?.value||'未入力';const note=el.querySelector('.note').value;lines.push(`${id} ${title}：${value}${note?' / メモ：'+note:''}`)});lines.push('')});lines.push('最終判定：'+(document.querySelector('input[name="verdict"]:checked')?.value||'未選択'));lines.push('総合所見：'+(document.getElementById('finalnote').value||'なし'));return lines.join('\n')}
document.getElementById('copy').addEventListener('click',async()=>{const text=report();try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',2500)});
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('入力内容をすべてリセットしますか？'))return;document.querySelectorAll('input[type=text],input[type=date],.note').forEach(x=>x.value='');document.getElementById('trade').value='';document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.getElementById('date').value=new Date().toISOString().slice(0,10);update()});document.getElementById('print').addEventListener('click',()=>window.print());
</script></body></html>
